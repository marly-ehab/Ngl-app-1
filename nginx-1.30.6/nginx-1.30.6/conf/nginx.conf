#user  nobody;
worker_processes  3;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    #this number depends on OS capability
    worker_connections  1024;
}


http {
    # req >> include files
    include       mime.types;

    #rate-limit
    # definition of zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1r/s;


    upstream ngl_service {
        server localhost:3001;
        server localhost:3002;
        server localhost:3003;
    }


    # upstream order_service {
    #     server localhost:5001;
    #     server localhost:5002;
    #     server localhost:5003;
    # }




    server {
        listen       80;
        server_name  localhost;

        #access_log  logs/host.access.log  main;
  #access_log  logs/host.access.log  main;


        location / {
           #nodelay: instead of rejected it queued >> put requests in queue
           #applay/use the zone
           limit_req zone=api_limit burst=5 nodelay; # add more 5 requests to rate

           # put on headers host key and IP key to contact BE so BE Know what host and IP came
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr; # X-Real-IP a header comunicate the client IP and $remote_addr is th IP adress of the client connecting nginx

           proxy_pass http://ngl_service; #forward the request to ngl-service group
        }

        #    when requests come to differnt path go to different group
        # location /orders {
        #     proxy_pass http://order-service
        # }

       #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }
}